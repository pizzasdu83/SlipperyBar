name: Homebrewing-the-tweak

on:
  workflow_dispatch:

  
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: Randomblock1/theos-action@v1

      # Télécharge le .deb DÉJÀ publié par le repo SlipperyUIKit (dernière
      # release) — on ne le reconstruit jamais ici, juste extraction du
      # framework pour le linker.
      - name: Download SlipperyUIKit and vendor the framework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          brew install dpkg
          rm -f packages/*
          mkdir -p /tmp/sui /tmp/sui-extract Vendor packages
          gh release download --repo pizzasdu83/SlipperyUIKit --pattern "*.deb" --dir /tmp/sui --clobber
          dpkg-deb -x /tmp/sui/*.deb /tmp/sui-extract
          cp -R /tmp/sui-extract/var/jb/Library/Frameworks/SlipperyUIKit.framework Vendor/SlipperyUIKit.framework
          cp /tmp/sui/*.deb packages/

      - name: Build package
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: "Package built by ${{ matrix.os }}"
          path: ${{ github.workspace }}/packages/*.deb
